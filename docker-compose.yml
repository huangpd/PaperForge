name: paperforge
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${PG_USER:-paperforge}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-paperforge}
      POSTGRES_DB: ${PG_DB:-paperforge}
    ports: ["${PG_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-paperforge} -d ${PG_DB:-paperforge}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
      KAFKA_MESSAGE_MAX_BYTES: 5242880
      KAFKA_REPLICA_FETCH_MAX_BYTES: 5242880
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports: ["${KAFKA_PORT:-9092}:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  worker:
    build: .
    command: >
      sh -c "python -m paperforge.cli migrate &&
             python -m paperforge.cli events init-topics &&
             python -m paperforge.cli worker run"
    environment:
      PG_HOST: postgres
      PG_USER: ${PG_USER:-paperforge}
      PG_PASSWORD: ${PG_PASSWORD:-paperforge}
      PG_DB: ${PG_DB:-paperforge}
      KAFKA_BOOTSTRAP: kafka:19092      # INTERNAL listener (the host uses localhost:9092)
      DATA_DIR: /app/data
    volumes: ["./data:/app/data"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 30s

  api:
    build: .
    command: uvicorn paperforge.api.app:app --host 0.0.0.0 --port 8000
    environment:
      PG_HOST: postgres
      PG_USER: ${PG_USER:-paperforge}
      PG_PASSWORD: ${PG_PASSWORD:-paperforge}
      PG_DB: ${PG_DB:-paperforge}
      DATA_DIR: /app/data
    volumes: ["./data:/app/data:ro"]
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports: ["127.0.0.1:${FRONTEND_PORT:-5173}:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  airflow:
    profiles: ["airflow"]
    build: {context: ., dockerfile: Dockerfile.airflow}
    entrypoint: ["/opt/paperforge/docker/airflow-entrypoint.sh"]
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-paperforge}:${PG_PASSWORD:-paperforge}@postgres:5432/airflow
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"      # local single-user setup; do not expose beyond localhost
      PF_PG_HOST: postgres
      PF_PG_USER: ${PG_USER:-paperforge}
      PF_PG_PASSWORD: ${PG_PASSWORD:-paperforge}
      PG_HOST: postgres
      PG_USER: ${PG_USER:-paperforge}
      PG_PASSWORD: ${PG_PASSWORD:-paperforge}
      PG_DB: ${PG_DB:-paperforge}
      KAFKA_BOOTSTRAP: kafka:19092
      DATA_DIR: /opt/paperforge/data
      PROJECT_DIR: /opt/paperforge
      CROSSREF_PARQUET_DIR: /crossref-parquet
      DUCKDB_MEMORY_LIMIT: 8GB            # Docker Desktop VM is set to 12 GiB; measured peak RSS of the sampling query is ~5 GB
      DUCKDB_THREADS: "4"
    ports: ["127.0.0.1:${AIRFLOW_PORT:-8080}:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./dbt:/opt/paperforge/dbt
      - ./data:/opt/paperforge/data
      - ./docker:/opt/paperforge/docker:ro
      - ${CROSSREF_PARQUET_DIR:-./data/crossref_parquet}:/crossref-parquet:ro   # offline dump, read-only
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
