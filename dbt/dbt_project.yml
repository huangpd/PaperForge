name: paperforge
version: "0.1.0"
config-version: 2
profile: paperforge
model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  lookback_hours: 1          # incremental models re-read this much history to tolerate late commits

models:
  paperforge:
    staging:
      +materialized: view
      +schema: stg
    intermediate:
      +materialized: table
      +schema: int
    marts:
      dim:
        +materialized: table
        +schema: dim
      dws:
        +schema: dws
      ads:
        +schema: ads
