paperforge:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PG_HOST', 'localhost') }}"
      port: "{{ env_var('PG_PORT', '5432') | as_number }}"
      user: "{{ env_var('PG_USER', 'paperforge') }}"
      password: "{{ env_var('PG_PASSWORD', 'paperforge') }}"
      dbname: "{{ env_var('PG_DB', 'paperforge') }}"
      schema: stg
      threads: 4
